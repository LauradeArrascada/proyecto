<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <title>Contacto | Huellitas Pet Shop</title>
    <meta name="description" content="Contactate con Huellitas Pet Shop en La Plata para consultar por alimentos, 
    accesorios y productos para mascotas.">
</head>

<body>
    <header>
        <a href="../index.html">
            <img src="../img/logo.jpg" alt="Logo de Huellitas" class="logo">
        </a>

        <nav>
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="./productos.html">Productos</a></li>
                <li><a href="./servicios.html">Servicios</a></li>
                <li><a href="./quienessomos.html">Quiénes somos</a></li>
                <li><a href="./contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="contacto">
        <section class="formulario-contacto">
            <h1>Contactanos</h1>
            <p>¿Tenés alguna consulta? Completá el formulario y nos pondremos en contacto con vos.</p>

            <form action="#" method="post">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono">

                <label for="asunto">Asunto</label>
                <input type="text" id="asunto" name="asunto">

                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="5" required></textarea>

                <button type="submit">Enviar mensaje 🐾</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Huellitas Pet Shop</p>

    <nav class="footer-nav">
        <a href="index.html">Inicio</a>
        <a href="productos.html">Productos</a>
        <a href="servicios.html">Servicios</a>
        <a href="quienes-somos.html">Quiénes somos</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <div class="redes-sociales">
        <a href="#" aria-label="Instagram">
            <img src="img/instagram.png" alt="logo Instagram">
        </a>
        <a href="#" aria-label="Facebook">
            <img src="img/facebook.png" alt="logo Facebook">
        </a>
        <a href="#" aria-label="WhatsApp">
            <img src="img/whatsapp.png" alt="Logo whatsapp">
        </a>
    </div>
        <form action="#" method="post">
            <label for="mailnewsletter">Suscribite al newsletter para recibir más novedades</label>
            <input type="email" name="mailnewsletter" id="mailnewsletter" placeholder="Dejanos tu email" required>
            <input type="submit" value="Suscribirse" class="buttonFooter">
        </form>
    </footer>
</body>
</html>
